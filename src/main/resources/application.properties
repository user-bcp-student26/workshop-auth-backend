quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${AUTH_CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.jackson.fail-on-unknown-properties=false
# Secreto de firma: vacio fuera de dev/test; el login no emite token sin el.
auth.token.secret=${AUTH_TOKEN_SECRET:}
# Valor de laboratorio: no es valido fuera del laboratorio.
%dev.auth.token.secret=${AUTH_TOKEN_SECRET:workshop-lab-secret-not-for-production-2026}
%test.auth.token.secret=${AUTH_TOKEN_SECRET:workshop-lab-secret-not-for-production-2026}
%test.quarkus.http.test-port=18081
